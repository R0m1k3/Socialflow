name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Application (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Les dépendances natives (canvas, sharp) et le navigateur Remotion ne
      # servent pas aux vérifications : on saute leurs scripts d'installation.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  ffmpeg-service:
    name: Service vidéo (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffmpeg-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ffmpeg-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
